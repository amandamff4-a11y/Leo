<title>Planejamento da Semana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pathway+Gothic+One&family=Rozha+One&display=swap" rel="stylesheet">
<style>
  /* Layout: abas de semanas no topo, 7 colunas de dias (domingo a sábado), listas da semana embaixo — igual ao planner em papel */
  :root {
    --bg: #fdf8f4;
    --surface: #fffaf8;
    --ink: #3d3b52;
    --muted: #6f6b82;
    --title: #d6336c;
    --script: #3b3a6b;
    --line: #3d3b5214;
    --pink: #e64980;
    --orange: #e8590c;
    --peach: #f08c00;
    --green: #2b8a3e;
    --blue: #1c7ed6;
    --purple: #6741d9;
    --indigo: #3b4cc0;
    --danger: #c92a2a;
    --shadow: #3d3b5233;
    --f-display: "Rozha One", Georgia, serif;
    --f-body: "Pathway Gothic One", "Arial Narrow", sans-serif;
    --f-hand: "Caveat", "Segoe Print", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b26; --surface: #25222f; --ink: #ece8f4; --muted: #a9a4bb; --title: #f783ac; --script: #c5c2f0;
      --line: #ffffff14; --pink: #f783ac; --orange: #ff922b; --peach: #ffc078; --green: #69db7c; --blue: #74c0fc;
      --purple: #b197fc; --indigo: #91a7ff; --danger: #ff8787; --shadow: #0008; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1b26; --surface: #25222f; --ink: #ece8f4; --muted: #a9a4bb; --title: #f783ac; --script: #c5c2f0;
    --line: #ffffff14; --pink: #f783ac; --orange: #ff922b; --peach: #ffc078; --green: #69db7c; --blue: #74c0fc;
    --purple: #b197fc; --indigo: #91a7ff; --danger: #ff8787; --shadow: #0008; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--f-body); font-size: 17px; letter-spacing: .2px;
  }
  .wrap {
    max-width: 1480px; margin: 0 auto;
    padding-block: 16px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--title); outline-offset: 2px; }

  /* Cabeçalho */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .hand { font-family: var(--f-hand); color: var(--script); font-size: 23px; line-height: 1.05; }
  .hand.left { transform: rotate(-10deg); justify-self: start; }
  .hand.right { transform: rotate(-12deg); justify-self: end; color: var(--title); }
  .title-block { text-align: center; }
  h1 {
    margin: 0; font-family: var(--f-display); font-weight: normal; color: var(--title);
    font-size: clamp(30px, 5vw, 58px); line-height: 1.05; transform: rotate(-1.5deg); text-wrap: balance;
  }
  .period {
    display: inline-block; margin-top: 6px; padding: 3px 26px; border-radius: 999px;
    background: color-mix(in srgb, var(--pink) 14%, var(--surface)); color: var(--ink);
    font-size: clamp(18px, 2.4vw, 26px);
  }
  @media (max-width: 760px) {
    header { grid-template-columns: 1fr 1fr; }
    .title-block { grid-column: 1 / -1; grid-row: 1; }
    .hand { font-size: 19px; }
  }

  /* Abas de semanas */
  .tabs-row { display: flex; gap: 10px; align-items: center; margin: 18px 0 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; flex: 1; min-width: 0; scrollbar-width: thin; }
  .tab {
    flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 6px 14px; cursor: pointer; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .tab:hover { border-color: var(--title); }
  .tab.on { background: var(--title); border-color: var(--title); color: var(--bg); }
  .tab small { opacity: .75; font-size: 14px; margin-left: 4px; }
  .tab.fixed-tab { border-style: dashed; }
  .tab.add { color: var(--title); border-style: dashed; }
  .progress {
    flex: none; display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--muted);
  }
  .bar { width: 110px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--title); border-radius: 99px; transition: width .3s; }
  @media (max-width: 620px) { .tabs-row { flex-wrap: wrap; } .progress { width: 100%; } .bar { flex: 1; } }
  .hint { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .notice {
    padding: 14px 16px; border-radius: 12px; margin-bottom: 12px;
    background: color-mix(in srgb, var(--peach) 16%, var(--surface)); color: var(--ink);
  }

  /* Dias */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 1250px) { .week { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 760px)  { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px)  { .week { grid-template-columns: 1fr; } }
  .day {
    --c: var(--pink); --tint: color-mix(in srgb, var(--c) 14%, var(--surface));
    background: linear-gradient(to bottom, var(--tint) 0 74px, var(--surface) 74px);
    border: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
    border-radius: 12px; padding: 8px 6px 10px; display: flex; flex-direction: column; min-width: 0;
  }
  .day.today { box-shadow: 0 0 0 2px var(--c); }
  .c-orange { --c: var(--orange); } .c-peach { --c: var(--peach); } .c-green { --c: var(--green); }
  .c-blue { --c: var(--blue); } .c-purple { --c: var(--purple); } .c-indigo { --c: var(--indigo); }
  .day-head { position: relative; text-align: center; color: var(--c); min-height: 62px; line-height: 1.1; }
  .day-name { font-size: 23px; text-transform: uppercase; letter-spacing: .6px; }
  .day-date { font-size: 21px; font-variant-numeric: tabular-nums; }
  .day-note { font-size: 15px; }
  .today-pill { font-size: 13px; background: var(--c); color: var(--surface); border-radius: 99px; padding: 0 8px; }
  .day-head .ico { position: absolute; right: 2px; top: 12px; }
  .items { display: flex; flex-direction: column; gap: 3px; flex: 1; margin-top: 6px; }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 10px 4px; }

  .item {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) 28px; gap: 4px; align-items: start;
    padding: 7px 5px; border-radius: 8px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .item:hover { background: color-mix(in srgb, var(--c) 8%, var(--surface)); }
  .item.hl { background: var(--tint); border-bottom-color: transparent; }
  .item .chk {
    appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 3px 0 0;
    border: 1.6px solid var(--c); border-radius: 4px; background: var(--surface); cursor: pointer;
    display: grid; place-content: center;
  }
  .item .chk:checked { background: var(--c); }
  .item .chk:checked::after, .list .chk:checked::after {
    content: ""; width: 8px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .item .time { font-size: 16px; font-variant-numeric: tabular-nums; }
  .item .text { font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
  .item .sub { font-size: 14.5px; color: var(--muted); line-height: 1.15; overflow-wrap: anywhere; }
  .item .fixed-mark { font-size: 12px; color: var(--c); letter-spacing: .5px; text-transform: uppercase; }
  .item.done .time, .item.done .text, .item.done .sub { text-decoration: line-through; opacity: .45; }
  .item .ico { color: var(--c); justify-self: end; }
  .item.special { grid-template-columns: 22px minmax(0, 1fr); text-align: center; padding: 12px 6px; background: var(--tint); }
  .item.special .text { font-size: 21px; color: var(--c); }
  .item.special .ico { justify-self: center; }
  .item.nochk { grid-template-columns: minmax(0, 1fr) 28px; }

  .add, .restore {
    margin-top: 6px; font-size: 15px; background: none; border: 1px dashed color-mix(in srgb, var(--c) 50%, transparent);
    color: var(--c); border-radius: 8px; padding: 5px; cursor: pointer;
  }
  .restore { border: 0; padding: 2px; text-decoration: underline; }
  .add:hover { background: var(--tint); }

  .ico svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .special .ico svg { width: 32px; height: 32px; }

  /* Listas da semana */
  .panels { display: grid; grid-template-columns: 1fr 1fr 1fr .85fr; gap: 10px; margin-top: 12px; }
  @media (max-width: 1100px) { .panels { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px)  { .panels { grid-template-columns: 1fr; } }
  .panel {
    --c: var(--pink); --tint: color-mix(in srgb, var(--c) 14%, var(--surface));
    background: linear-gradient(to bottom, var(--tint) 0 46px, var(--surface) 46px);
    border: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
    border-radius: 12px; padding: 10px 16px 14px; min-width: 0;
  }
  .panel h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-weight: normal; font-size: 22px; color: var(--c); text-transform: uppercase; letter-spacing: .6px; }
  .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
  .list li { display: flex; align-items: flex-start; gap: 8px; }
  .list .chk {
    appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin-top: 5px;
    border: 1.6px solid var(--c); border-radius: 4px; background: var(--surface); cursor: pointer; display: grid; place-content: center;
  }
  .list .chk:checked { background: var(--c); }
  .list textarea {
    flex: 1; resize: none; field-sizing: content; overflow: hidden; line-height: 1.25; min-width: 0; font: inherit; font-size: 17px; color: var(--ink); background: transparent;
    border: 0; border-radius: 4px; padding: 2px 4px;
  }
  .list textarea:focus { background: var(--tint); outline: none; }
  .list li.done textarea { text-decoration: line-through; opacity: .45; }
  .list .x { border: 0; background: none; color: var(--danger); cursor: pointer; font-size: 20px; line-height: 1; opacity: .35; }
  .list li:hover .x, .list .x:focus-visible { opacity: 1; }
  .panel .add { width: 100%; }
  .remember .big {
    font-family: var(--f-hand); font-weight: 700; color: var(--title); font-size: 32px;
    background: color-mix(in srgb, var(--pink) 14%, var(--surface)); border-radius: 999px;
    display: inline-block; padding: 0 18px; transform: rotate(-5deg); margin: 4px 0 8px;
  }
  .remember p { font-family: var(--f-hand); font-size: 23px; color: var(--script); line-height: 1.25; transform: rotate(-3deg); margin: 0; }

  /* Editor */
  dialog {
    border: 0; border-radius: 16px; padding: 0; width: min(460px, calc(100vw - 32px));
    color: var(--ink); background: var(--surface); box-shadow: 0 20px 60px var(--shadow);
  }
  dialog::backdrop { background: #1d1b2666; }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  dialog h3 { margin: 0; font-family: var(--f-display); color: var(--title); font-weight: normal; font-size: 25px; }
  .fixed-note { margin: -6px 0 0; font-size: 15px; color: var(--muted); }
  dialog label { display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
  dialog input[type=text], dialog select {
    font: inherit; font-size: 18px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
  }
  dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  dialog .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 17px; }
  .icon-pick { display: flex; flex-wrap: wrap; gap: 5px; }
  .icon-pick button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px; cursor: pointer; color: var(--ink); }
  .icon-pick button.on { border-color: var(--title); color: var(--title); background: color-mix(in srgb, var(--pink) 14%, var(--surface)); }
  .icon-pick .ico svg { width: 21px; height: 21px; }
  .icon-pick .none { width: 21px; height: 21px; display: grid; place-content: center; }
  .actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 4px; }
  .actions span { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--bg); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 16px; }
  .btn.primary { background: var(--title); border-color: var(--title); color: var(--bg); }
  .btn.danger { color: var(--danger); }
  .btn.danger.armed { background: var(--danger); color: var(--bg); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 16px;
    max-width: calc(100vw - 32px);
  }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="hand left">disciplina<br>também é<br>amor próprio ♡</div>
    <div class="title-block">
      <h1>PLANEJAMENTO DA SEMANA</h1>
      <div class="period" id="period">carregando…</div>
    </div>
    <div class="hand right">foco<br>organização<br>evolução<br>momentos bons ♡</div>
  </header>

  <div class="tabs-row">
    <nav class="tabs" id="tabs" aria-label="Semanas"></nav>
    <div class="progress" id="progress"></div>
  </div>
  <p class="hint" id="hint"></p>
  <div class="notice" id="notice" hidden></div>

  <main class="week" id="week"></main>
  <section class="panels" id="panels"></section>
</div>

<dialog id="dlg">
  <form id="form">
    <h3 id="dlgTitle">Editar</h3>
    <p class="fixed-note" id="fixedNote" hidden>Atividade fixa: aparece em todas as semanas. Mudanças aqui valem para todas.</p>
    <div class="row">
      <label>Horário<input type="text" id="fTime" name="time" placeholder="ex.: 14:00 – 18:00 ou Tarde"></label>
      <label><span id="whenLabel">Dia</span><select id="fWhen" name="when"></select></label>
    </div>
    <label>Atividade<input type="text" id="fText" name="text" placeholder="ex.: Faculdade" required></label>
    <label>Detalhe (opcional)<input type="text" id="fSub" name="sub" placeholder="ex.: (bloco 1 – revisão)"></label>
    <label>Ícone<div class="icon-pick" id="iconPick"></div></label>
    <div class="row">
      <label class="check"><input type="checkbox" id="fHl" name="hl"> Destacar</label>
      <label class="check" id="repeatWrap"><input type="checkbox" id="fRepeat" name="repeat"> Repete toda semana</label>
    </div>
    <div class="actions">
      <span>
        <button type="button" class="btn danger" id="btnDelete">Excluir</button>
        <button type="button" class="btn" id="btnSkip" hidden>Pular nesta semana</button>
      </span>
      <span>
        <button type="button" class="btn" id="btnCancel">Cancelar</button>
        <button type="submit" class="btn primary">Salvar</button>
      </span>
    </div>
  </form>
</dialog>

<script>
const ICONS = {
  cafe: '<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/>',
  carro: '<path d="M3 15v-3l2-5h14l2 5v3"/><rect x="2" y="12" width="20" height="5" rx="1.5"/><circle cx="7" cy="17.5" r="1.5"/><circle cx="17" cy="17.5" r="1.5"/>',
  notebook: '<rect x="4" y="5" width="16" height="11" rx="1"/><path d="M2 19h20"/>',
  livro: '<path d="M2 5c3-1 7-1 10 1v14c-3-2-7-2-10-1z"/><path d="M22 5c-3-1-7-1-10 1v14c3-2 7-2 10-1z"/>',
  comida: '<path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18"/><path d="M17 3c-2 0-3 3-3 6s1 3 3 3v9"/>',
  coracao: '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
  lua: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  tenis: '<ellipse cx="15" cy="8" rx="5" ry="6" transform="rotate(40 15 8)"/><path d="M11 12l-8 9M12 5l6 6M10 8l6 6"/>',
  academia: '<path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/>',
  prova: '<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  apresentacao: '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 21h8M7 12l3-3 2 2 4-4"/>',
  taca: '<path d="M7 3h10l-1 6a4 4 0 0 1-8 0z"/><path d="M12 13v7M8 21h8"/>',
  lista: '<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h1M11 8h5M8 12h1M11 12h5M8 16h1M11 16h5"/>',
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  laco: '<path d="M12 11c-3-5-9-6-9-2s6 4 9 2zM12 11c3-5 9-6 9-2s-6 4-9 2z"/><path d="M11 12l-4 8M13 12l4 8"/>',
  folha: '<path d="M12 21V8"/><path d="M12 12c-4 0-6-3-6-7 4 0 6 3 6 7zM12 9c3 0 5-2 5-6-3 0-5 2-5 6z"/>',
  bolo: '<rect x="4" y="12" width="16" height="8" rx="1.5"/><path d="M4 15c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 4 0"/><path d="M7 12V9h10v3M12 9V6"/><circle cx="12" cy="4.5" r="1"/>',
  capelo: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/>',
  estrela: '<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
  medico: '<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a4 4 0 0 0 8 0v-2"/><circle cx="18" cy="12" r="2"/>'
};
const icon = n => n && ICONS[n] ? `<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg></span>` : '<span class="ico"></span>';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const DAYS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const DAY_COLOR = ['', 'c-orange', 'c-peach', 'c-green', 'c-blue', 'c-purple', 'c-peach'];
const DAY_ICON = ['coracao', 'sol', 'coracao', 'folha', 'laco', 'coracao', 'sol'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const LISTS = [
  { key: 'prioridades', title: 'Prioridades da semana', icon: 'coracao', color: '' },
  { key: 'academicas', title: 'Tarefas acadêmicas', icon: 'capelo', color: 'c-indigo' },
  { key: 'pessoais', title: 'Pendências pessoais', icon: 'coracao', color: 'c-green' }
];

// ---------- Datas (semanas de domingo a sábado) ----------
const parse = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return fmt(d); };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() - x.getDay()); return fmt(x); };
const ddmm = iso => { const d = parse(iso); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; };
const TODAY = fmt(new Date());
const THIS_WEEK = weekStart(new Date());

function minutes(it) {
  if (it.special) return -1;
  const t = (it.time || '').toLowerCase();
  const m = t.match(/(\d{1,2}):(\d{2})/);
  if (m) return +m[1] * 60 + +m[2];
  if (t.startsWith('manh')) return 480;
  if (t.startsWith('tarde')) return 840;
  if (t.startsWith('noite')) return 1140;
  return 2000;
}

// ---------- Estado ----------
let db = null;
let fixed = [];          // atividades fixas: {id, weekday, time, text, sub, icon, hl}
const weeks = new Map(); // id da semana (data do domingo) -> documento
let loaded = { fixed: false, weeks: false };
let selected = THIS_WEEK;
try { selected = localStorage.getItem('agenda-aba') || THIS_WEEK; } catch {}

const blankWeek = start => ({ start, items: [], done: {}, skip: [], notes: {}, lists: { prioridades: [], academicas: [], pessoais: [] } });
const weekDoc = id => weeks.get(id) || blankWeek(id);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let chain = Promise.resolve();
function queue(fn) {
  chain = chain.then(fn).catch(e => toast(e && e.code === 'quota_exceeded' ? 'A agenda está cheia: apague semanas antigas.' : 'Não consegui salvar. Tente de novo.'));
  return chain;
}
function saveWeek(id, patch) {
  if (!db) return toast('Abra pelo link do Claude para salvar.');
  const exists = weeks.has(id);
  if (!exists) weeks.set(id, { ...blankWeek(id), ...patch });
  else {
    const cur = weeks.get(id), next = { ...cur };
    for (const k in patch) next[k] = (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k]) && cur[k]) ? { ...cur[k], ...patch[k] } : patch[k];
    weeks.set(id, next);
  }
  const full = weeks.get(id);
  return queue(() => exists ? db.doc('weeks/' + id).update(patch) : db.doc('weeks/' + id).set(full));
}

// ---------- Abas ----------
const tabsEl = document.getElementById('tabs');
function weekIds() {
  const ids = new Set([...weeks.keys(), THIS_WEEK]);
  if (selected !== 'fixas') ids.add(selected);
  return [...ids].sort();
}
function renderTabs() {
  const ids = weekIds();
  tabsEl.innerHTML = `<button class="tab fixed-tab ${selected === 'fixas' ? 'on' : ''}" data-week="fixas">★ Atividades fixas</button>` +
    ids.map(id => `<button class="tab ${id === selected ? 'on' : ''}" data-week="${id}">${ddmm(id)} – ${ddmm(addDays(id, 6))}${id === THIS_WEEK ? '<small>esta semana</small>' : ''}</button>`).join('') +
    `<button class="tab add" data-week="${addDays(ids[ids.length - 1], 7)}" title="Abrir a semana seguinte">+ próxima semana</button>`;
  const on = tabsEl.querySelector('.tab.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  selected = b.dataset.week;
  try { localStorage.setItem('agenda-aba', selected); } catch {}
  renderAll();
});

// ---------- Dias ----------
const weekEl = document.getElementById('week');
function dayItems(wid, i) {
  const w = weekDoc(wid), iso = addDays(wid, i);
  const skip = new Set(w.skip || []);
  const fx = fixed.filter(f => f.weekday === i).map(f => ({ ...f, key: f.id + '_' + iso, fixed: true }));
  const shown = fx.filter(f => !skip.has(f.key));
  const own = (w.items || []).filter(it => it.date === iso).map(it => ({ ...it, key: it.id }));
  return { iso, list: [...shown, ...own].sort((a, b) => minutes(a) - minutes(b)), skipped: fx.length - shown.length };
}
function itemHtml(it, checkable, done) {
  if (it.special) return `
    <div class="item special" tabindex="0" data-key="${it.key}">
      ${checkable ? `<input type="checkbox" class="chk" ${done ? 'checked' : ''} aria-label="Feito">` : '<span></span>'}
      <span>${icon(it.icon)}<span class="text">${esc(it.text)}</span></span>
    </div>`;
  return `
    <div tabindex="0" class="item ${it.hl ? 'hl' : ''} ${done ? 'done' : ''} ${checkable ? '' : 'nochk'}" data-key="${it.key}">
      ${checkable ? `<input type="checkbox" class="chk" ${done ? 'checked' : ''} aria-label="Feito">` : ''}
      <span>
        ${it.time ? `<span class="time">${esc(it.time)}</span><br>` : ''}
        <span class="text">${esc(it.text)}</span>
        ${it.sub ? `<br><span class="sub">${esc(it.sub)}</span>` : ''}
        ${it.fixed && checkable ? '<br><span class="fixed-mark">fixa</span>' : ''}
      </span>
      ${icon(it.icon)}
    </div>`;
}
function renderWeek() {
  if (selected === 'fixas') return renderFixed();
  const w = weekDoc(selected);
  let total = 0, made = 0;
  weekEl.innerHTML = DAYS.map((name, i) => {
    const { iso, list, skipped } = dayItems(selected, i);
    const note = (w.notes || {})[iso];
    list.forEach(it => { total++; if (w.done?.[it.key]) made++; });
    return `
      <article class="day ${DAY_COLOR[i]} ${iso === TODAY ? 'today' : ''}" data-iso="${iso}">
        <div class="day-head">
          <div class="day-name">${name}</div>
          <div class="day-date">${ddmm(iso)}</div>
          ${note ? `<div class="day-note">(${esc(note)})</div>` : ''}
          ${iso === TODAY ? '<span class="today-pill">hoje</span>' : ''}
          ${icon(DAY_ICON[i])}
        </div>
        <div class="items">
          ${list.length ? list.map(it => itemHtml(it, true, !!w.done?.[it.key])).join('') : '<div class="empty">Nada marcado ainda</div>'}
        </div>
        ${skipped ? `<button class="restore" data-restore="${iso}">↺ ${skipped} fixa${skipped > 1 ? 's' : ''} pulada${skipped > 1 ? 's' : ''}: mostrar de novo</button>` : ''}
        <button class="add" data-add="${iso}">+ adicionar</button>
      </article>`;
  }).join('');
  const pct = total ? Math.round(made / total * 100) : 0;
  document.getElementById('progress').innerHTML = `<span>${made} de ${total} feitas</span><span class="bar"><i style="width:${pct}%"></i></span>`;
}
function renderFixed() {
  weekEl.innerHTML = DAYS.map((name, i) => {
    const list = fixed.filter(f => f.weekday === i).sort((a, b) => minutes(a) - minutes(b)).map(f => ({ ...f, key: f.id, fixed: true }));
    return `
      <article class="day ${DAY_COLOR[i]}" data-wd="${i}">
        <div class="day-head"><div class="day-name">${name}</div><div class="day-date">toda semana</div>${icon(DAY_ICON[i])}</div>
        <div class="items">${list.length ? list.map(it => itemHtml(it, false)).join('') : '<div class="empty">Sem atividades fixas</div>'}</div>
        <button class="add" data-addfixed="${i}">+ adicionar fixa</button>
      </article>`;
  }).join('');
  document.getElementById('progress').innerHTML = `<span>${fixed.length} atividades fixas</span>`;
}
weekEl.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.add) return openEditor({ mode: 'new', iso: t.dataset.add });
  if (t.dataset.addfixed) return openEditor({ mode: 'newFixed', wd: +t.dataset.addfixed });
  if (t.dataset.restore) {
    const w = weekDoc(selected), iso = t.dataset.restore;
    return (saveWeek(selected, { skip: (w.skip || []).filter(k => !k.endsWith('_' + iso)) }), renderAll());
  }
  const item = t.closest('.item'); if (!item) return;
  const key = item.dataset.key;
  if (t.classList.contains('chk')) {
    item.classList.toggle('done', t.checked);
    saveWeek(selected, { done: { [key]: t.checked } });
    return renderWeek();
  }
  if (selected === 'fixas') return openEditor({ mode: 'fixed', id: key });
  const [fid, iso] = key.split('_');
  if (iso) return openEditor({ mode: 'fixed', id: fid, iso });
  openEditor({ mode: 'week', id: key });
});
weekEl.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('item')) e.target.click(); });

// ---------- Listas da semana ----------
const panelsEl = document.getElementById('panels');
function renderPanels() {
  if (panelsEl.contains(document.activeElement) && document.activeElement.tagName === 'TEXTAREA') return;
  if (selected === 'fixas') { panelsEl.innerHTML = ''; return; }
  const lists = weekDoc(selected).lists || {};
  panelsEl.innerHTML = LISTS.map(l => `
    <div class="panel ${l.color}" data-list="${l.key}">
      <h2>${icon(l.icon)}${l.title}</h2>
      <ul class="list">
        ${(lists[l.key] || []).map((it, i) => `
          <li class="${it.done ? 'done' : ''}" data-i="${i}">
            <input type="checkbox" class="chk" ${it.done ? 'checked' : ''} aria-label="Feito">
            <textarea rows="1" id="l-${l.key}-${i}" placeholder="Escreva aqui…" aria-label="Item">${esc(it.text)}</textarea>
            <button class="x" aria-label="Excluir item">×</button>
          </li>`).join('')}
      </ul>
      <button class="add">+ adicionar</button>
    </div>`).join('') + `
    <div class="panel remember c-orange">
      <h2>${icon('sol')}Lembre-se</h2>
      <div class="big">Você consegue! ♡</div>
      <p>Organização também é autocuidado.<br>Disciplina hoje, conquistas amanhã.<br>Cada passo importa. ♡</p>
    </div>`;
}
function listOf(panel) { return [...((weekDoc(selected).lists || {})[panel.dataset.list] || [])].map(x => ({ ...x })); }
function saveList(panel, arr) { saveWeek(selected, { lists: { [panel.dataset.list]: arr } }); }
panelsEl.addEventListener('click', e => {
  const panel = e.target.closest('.panel[data-list]'); if (!panel) return;
  const arr = listOf(panel), li = e.target.closest('li');
  if (e.target.classList.contains('chk')) { arr[li.dataset.i].done = e.target.checked; li.classList.toggle('done', e.target.checked); return saveList(panel, arr); }
  if (e.target.classList.contains('x')) { arr.splice(li.dataset.i, 1); saveList(panel, arr); return renderPanels(); }
  if (e.target.classList.contains('add')) {
    arr.push({ text: '', done: false }); saveList(panel, arr); renderPanels();
    const inputs = panelsEl.querySelectorAll(`[data-list="${panel.dataset.list}"] textarea`);
    inputs[inputs.length - 1]?.focus();
  }
});
panelsEl.addEventListener('change', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const panel = e.target.closest('.panel'), arr = listOf(panel);
  arr[e.target.closest('li').dataset.i].text = e.target.value.trim();
  saveList(panel, arr);
});
panelsEl.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA') { e.preventDefault(); e.target.blur(); } });
panelsEl.addEventListener('focusout', () => setTimeout(() => { if (!panelsEl.contains(document.activeElement)) renderPanels(); }, 50));

// ---------- Editor ----------
const dlg = document.getElementById('dlg'), form = document.getElementById('form');
const $ = id => document.getElementById(id);
const iconPick = $('iconPick');
let ctx = null, pickedIcon = '';
iconPick.innerHTML = '<button type="button" data-icon="" title="sem ícone"><span class="none">∅</span></button>' +
  Object.keys(ICONS).map(n => `<button type="button" data-icon="${n}" title="${n}">${icon(n)}</button>`).join('');
iconPick.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { pickedIcon = b.dataset.icon; markIcon(); } });
const markIcon = () => iconPick.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.icon === pickedIcon));

function openEditor(c) {
  ctx = c;
  const isFixed = c.mode === 'fixed' || c.mode === 'newFixed';
  let it = { time: '', text: '', sub: '', icon: 'coracao', hl: false };
  if (c.mode === 'week') it = weekDoc(selected).items.find(x => x.id === c.id);
  if (c.mode === 'fixed') it = fixed.find(x => x.id === c.id);
  if (!it) return;
  $('dlgTitle').textContent = c.mode.startsWith('new') ? 'Nova atividade' : 'Editar atividade';
  $('fixedNote').hidden = !(c.mode === 'fixed');
  $('whenLabel').textContent = isFixed ? 'Dia da semana' : 'Dia';
  $('fWhen').innerHTML = isFixed
    ? DAYS.map((d, i) => `<option value="${i}">${d}</option>`).join('')
    : DAYS.map((d, i) => { const iso = addDays(selected, i); return `<option value="${iso}">${d} ${ddmm(iso)}</option>`; }).join('');
  $('fWhen').value = isFixed ? String(c.mode === 'fixed' ? it.weekday : c.wd) : (c.iso || it.date);
  $('fTime').value = it.time || ''; $('fText').value = it.text || ''; $('fSub').value = it.sub || '';
  $('fHl').checked = !!it.hl;
  $('repeatWrap').hidden = isFixed; $('fRepeat').checked = false;
  $('btnDelete').hidden = c.mode.startsWith('new');
  $('btnDelete').classList.remove('armed'); $('btnDelete').textContent = c.mode === 'fixed' ? 'Excluir de todas as semanas' : 'Excluir';
  $('btnSkip').hidden = !(c.mode === 'fixed' && c.iso);
  pickedIcon = it.icon || ''; markIcon();
  dlg.showModal();
  $('fText').focus();
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const base = { time: $('fTime').value.trim(), text: $('fText').value.trim() || 'Atividade', sub: $('fSub').value.trim(), icon: pickedIcon, hl: $('fHl').checked };
  const when = $('fWhen').value;
  if (ctx.mode === 'fixed' || ctx.mode === 'newFixed' || $('fRepeat').checked) {
    const wd = (ctx.mode === 'fixed' || ctx.mode === 'newFixed') ? +when : parse(when).getDay();
    const id = ctx.mode === 'fixed' ? ctx.id : uid('f');
    const doc = { ...base, weekday: wd };
    if (!db) return toast('Abra pelo link do Claude para salvar.');
    const i = fixed.findIndex(f => f.id === id);
    i >= 0 ? (fixed[i] = { id, ...doc }) : fixed.push({ id, ...doc });
    queue(() => db.doc('fixed/' + id).set(doc));
    if (ctx.mode === 'week') removeWeekItem(ctx.id);
  } else {
    const items = weekDoc(selected).items.map(x => ({ ...x }));
    if (ctx.mode === 'week') { const i = items.findIndex(x => x.id === ctx.id); items[i] = { ...items[i], ...base, date: when }; }
    else items.push({ id: uid('w'), ...base, date: when });
    saveWeek(selected, { items });
  }
  dlg.close(); renderAll();
});
function removeWeekItem(id) { saveWeek(selected, { items: weekDoc(selected).items.filter(x => x.id !== id) }); }
$('btnCancel').onclick = () => dlg.close();
$('btnSkip').onclick = () => {
  const w = weekDoc(selected);
  saveWeek(selected, { skip: [...(w.skip || []), ctx.id + '_' + ctx.iso] });
  dlg.close(); renderAll();
};
$('btnDelete').onclick = () => {
  const b = $('btnDelete');
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Toque de novo para excluir'; return; }
  if (ctx.mode === 'fixed') {
    if (!db) return toast('Abra pelo link do Claude para salvar.');
    fixed = fixed.filter(f => f.id !== ctx.id);
    queue(() => db.doc('fixed/' + ctx.id).delete());
  } else removeWeekItem(ctx.id);
  dlg.close(); renderAll();
};

// ---------- Geral ----------
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function renderAll() {
  if (selected === 'fixas') {
    $('period').textContent = 'atividades que se repetem toda semana';
    $('hint').textContent = 'O que estiver aqui aparece sozinho em todas as semanas. Clique numa atividade para mudar ou excluir.';
  } else {
    const s = parse(selected), e = parse(addDays(selected, 6));
    $('period').textContent = `${s.getDate()} de ${MONTHS[s.getMonth()]} a ${String(e.getDate()).padStart(2, '0')} de ${MONTHS[e.getMonth()]}`;
    $('hint').textContent = 'Marque a caixinha quando fizer · clique numa atividade para editar · as marcadas como "fixa" se repetem toda semana';
  }
  renderTabs(); renderWeek(); renderPanels();
}

renderAll();
(async () => {
  db = window.claude?.use ? await window.claude.use('db') : null;
  if (!db) {
    const n = $('notice'); n.hidden = false;
    n.textContent = 'Sua agenda fica salva na nuvem quando você abre esta página pelo link do Claude. Aqui ela não consegue carregar nem salvar.';
    return;
  }
  db.collection('fixed').onSnapshot(snap => {
    fixed = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.fixed = true; renderAll();
  }, () => toast('Perdi a conexão com a agenda. Recarregue a página.'));
  db.collection('weeks').onSnapshot(snap => {
    weeks.clear();
    snap.docs.forEach(d => weeks.set(d.id, { ...blankWeek(d.id), ...d.data() }));
    loaded.weeks = true; renderAll();
  }, () => toast('Perdi a conexão com a agenda. Recarregue a página.'));
})();
</script>
