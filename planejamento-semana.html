<title>Planejamento da Semana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pathway+Gothic+One&family=Rozha+One&display=swap" rel="stylesheet">
<style>
  /* Layout: menu principal (Rotina, Livros, Filmes e séries) → na rotina: semana → dia → manhã/tarde/noite, como um planner em camadas */
  :root {
    --bg: #fdf8f4; --surface: #fffaf8; --raised: #ffffff;
    --ink: #3d3b52; --muted: #6f6b82; --line: #3d3b521a;
    --title: #d6336c; --script: #3b3a6b; --shadow: #3d3b5226;
    --pink: #e64980; --orange: #e8590c; --peach: #e67700; --green: #2b8a3e;
    --blue: #1c7ed6; --purple: #6741d9; --indigo: #3b4cc0; --slate: #6c7a89; --gold: #c28a00; --danger: #c92a2a;
    --f-display: "Rozha One", Georgia, serif;
    --f-body: "Pathway Gothic One", "Arial Narrow", sans-serif;
    --f-hand: "Caveat", "Segoe Print", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b26; --surface: #25222f; --raised: #2c2938; --ink: #ece8f4; --muted: #a9a4bb; --line: #ffffff1a;
      --title: #f783ac; --script: #c5c2f0; --shadow: #0009;
      --pink: #f783ac; --orange: #ff922b; --peach: #ffc078; --green: #69db7c; --blue: #74c0fc; --purple: #b197fc;
      --indigo: #91a7ff; --slate: #adb5bd; --gold: #ffd43b; --danger: #ff8787; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1b26; --surface: #25222f; --raised: #2c2938; --ink: #ece8f4; --muted: #a9a4bb; --line: #ffffff1a;
    --title: #f783ac; --script: #c5c2f0; --shadow: #0009;
    --pink: #f783ac; --orange: #ff922b; --peach: #ffc078; --green: #69db7c; --blue: #74c0fc; --purple: #b197fc;
    --indigo: #91a7ff; --slate: #adb5bd; --gold: #ffd43b; --danger: #ff8787; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 18px; letter-spacing: .2px;
    background-image:
      radial-gradient(circle at 6% 0%, color-mix(in srgb, var(--pink) 18%, transparent) 0 160px, transparent 420px),
      radial-gradient(circle at 100% 22%, color-mix(in srgb, var(--peach) 16%, transparent) 0 140px, transparent 380px),
      radial-gradient(circle at 0% 85%, color-mix(in srgb, var(--green) 12%, transparent) 0 120px, transparent 360px),
      radial-gradient(circle at 96% 100%, color-mix(in srgb, var(--purple) 12%, transparent) 0 120px, transparent 360px),
      radial-gradient(color-mix(in srgb, var(--pink) 20%, transparent) 1.2px, transparent 1.7px);
    background-size: auto, auto, auto, auto, 22px 22px;
    background-attachment: fixed;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding-block: 14px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row-item:focus-visible { outline: 2px solid var(--title); outline-offset: 2px; }
  .tint { background: color-mix(in srgb, var(--c, var(--pink)) 13%, var(--surface)); }

  /* ---------- Cabeçalho ---------- */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .hand { font-family: var(--f-hand); color: var(--script); font-size: 22px; line-height: 1.05; }
  .hand.left { transform: rotate(-9deg); justify-self: start; display: flex; align-items: center; gap: 6px; }
  .hand.right { transform: rotate(-10deg); justify-self: end; color: var(--title); display: flex; align-items: center; gap: 6px; }
  .deco { flex: none; width: 54px; height: 70px; }
  .deco.sun { width: 62px; height: 62px; transform: rotate(10deg); }
  .title-block { text-align: center; }
  .hello { font-family: var(--f-hand); font-size: 24px; color: var(--script); margin-top: 6px; }
  .hello b { color: var(--title); font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) {
    .deco.sun { animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(370deg); } }
    .chk:checked { animation: pop .28s ease-out; }
    @keyframes pop { 50% { transform: scale(1.3); } }
  }
  h1 { margin: 0; text-align: center; font-family: var(--f-display); font-weight: normal; color: var(--title); font-size: clamp(28px, 4.6vw, 50px); line-height: 1.05; transform: rotate(-1.5deg); text-wrap: balance; }
  @media (max-width: 700px) {
    header { grid-template-columns: 1fr 1fr; }
    .title-block { grid-column: 1 / -1; grid-row: 1; }
    .hand { font-size: 18px; }
    .deco { width: 36px; height: 48px; } .deco.sun { width: 42px; height: 42px; }
  }

  /* ---------- Menu principal ---------- */
  .mainnav { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin: 18px 0 16px; }
  .mainnav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; line-height: 1.05; text-align: center;
    --c: var(--title); border: 1.5px solid color-mix(in srgb, var(--c) 35%, transparent);
    background: color-mix(in srgb, var(--c) 9%, var(--surface)); border-radius: 16px; padding: 10px 8px;
    font-size: 16px; text-transform: uppercase; letter-spacing: .6px; box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 25%, transparent);
    transition: transform .15s;
  }
  .mainnav button:hover { transform: translateY(-2px); }
  .mainnav button[aria-current="page"] { background: var(--c); border-color: var(--c); color: var(--surface); }
  .mainnav button[aria-current="page"] .ico { color: var(--surface); }
  .mainnav .ico { color: var(--c); }
  .mainnav [data-view="treino"] { --c: var(--green); }
  .mainnav [data-view="livros"] { --c: var(--indigo); }
  .mainnav [data-view="bem"] { --c: var(--orange); }
  .mainnav [data-view="dinheiro"] { --c: var(--gold); }
  .mainnav [data-view="diario"] { --c: var(--purple); }
  .mainnav [data-view="filmes"] { --c: var(--blue); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }
  @media (max-width: 900px) { .mainnav { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } .mainnav button { font-size: 13.5px; padding: 8px 4px; letter-spacing: .3px; } }

  /* ---------- Barra da semana ---------- */
  .weekbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .weekbar .arrow { border: 1px solid var(--line); background: var(--surface); width: 38px; height: 38px; border-radius: 50%; font-size: 22px; line-height: 1; }
  .weekbar .label { font-size: 24px; min-width: 0; }
  .weekbar .label small { display: block; font-size: 15px; color: var(--muted); }
  .weekbar .today-btn { border: 1px dashed var(--title); color: var(--title); background: none; border-radius: 999px; padding: 4px 12px; font-size: 16px; }
  .weekbar .prog { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 16px; }
  .bar { width: 120px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: inline-block; }
  .bar i { display: block; height: 100%; background: var(--c, var(--title)); border-radius: 99px; transition: width .3s; }
  @media (max-width: 620px) { .weekbar .prog { width: 100%; margin-left: 0; } .weekbar .prog .bar { flex: 1; } }

  .subnav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .subnav button { flex: none; border: 0; background: none; padding: 8px 12px; font-size: 18px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .subnav button[aria-selected="true"] { color: var(--title); border-bottom-color: var(--title); }

  /* ---------- Dia a dia ---------- */
  .strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  .chip {
    --c: var(--pink); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    background: color-mix(in srgb, var(--c) 9%, var(--surface)); border-radius: 14px; padding: 6px 2px; display: grid; justify-items: center; gap: 1px; position: relative;
  }
  .chip .dow { font-size: 14px; text-transform: uppercase; color: var(--c); letter-spacing: .6px; }
  .chip .num { font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
  .chip .cnt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--c); border-color: var(--c); }
  .chip.on .dow, .chip.on .num, .chip.on .cnt { color: var(--surface); }
  .chip.today::after { content: ""; position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--title); }
  .chip.on.today::after { background: var(--surface); }
  .chip.complete .cnt::before { content: "✓ "; }

  .c-0 { --c: var(--pink); } .c-1 { --c: var(--orange); } .c-2 { --c: var(--peach); } .c-3 { --c: var(--green); }
  .c-4 { --c: var(--blue); } .c-5 { --c: var(--purple); } .c-6 { --c: var(--peach); }

  .daycard { background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent); border-radius: 16px; overflow: hidden; }
  .daycard-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
  .daycard-head h2 { margin: 0; font-weight: normal; font-size: 26px; color: var(--c); }
  .daycard-head .note { font-size: 16px; color: var(--muted); }
  .daycard-head .prog { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 16px; }
  .groups { padding: 4px 16px 14px; display: grid; gap: 14px; }
  .group h3 { margin: 0 0 4px; display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }
  .group h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .group h3 .ico svg { width: 18px; height: 18px; }

  .row-item {
    --k: var(--slate);
    display: grid; grid-template-columns: 26px 96px minmax(0, 1fr) 28px; gap: 8px; align-items: center;
    padding: 9px 10px; border-radius: 10px; border-left: 4px solid var(--k); cursor: pointer;
    background: color-mix(in srgb, var(--k) 6%, var(--surface)); margin-top: 5px;
  }
  .row-item:hover { background: color-mix(in srgb, var(--k) 12%, var(--surface)); }
  .row-item.hl { background: color-mix(in srgb, var(--k) 15%, var(--surface)); }
  .row-item .time { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .row-item .text { font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
  .row-item .sub { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .row-item .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 12.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--k); }
  .tag.fx { color: var(--muted); }
  .row-item .ico { color: var(--k); justify-self: end; }
  .row-item.done { opacity: .55; }
  .row-item.done .text, .row-item.done .time { text-decoration: line-through; }
  .row-item.special { grid-template-columns: 26px minmax(0, 1fr) 36px; border-left-color: var(--title); background: color-mix(in srgb, var(--pink) 14%, var(--surface)); }
  .row-item.special .text { font-size: 23px; color: var(--title); }
  .row-item.special .ico svg { width: 32px; height: 32px; }
  .row-item.nochk { grid-template-columns: 96px minmax(0, 1fr) 28px; }
  @media (max-width: 520px) {
    .row-item { grid-template-columns: 26px 64px minmax(0, 1fr) 24px; gap: 6px; padding: 8px; }
    .row-item.nochk { grid-template-columns: 64px minmax(0, 1fr) 24px; }
    .row-item .time { font-size: 15px; }
  }

  .chk {
    appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 0;
    border: 2px solid var(--k, var(--c, var(--title))); border-radius: 6px; background: var(--raised); cursor: pointer;
    display: grid; place-content: center;
  }
  .chk:checked { background: var(--k, var(--c, var(--title))); }
  .chk:checked::after { content: ""; width: 10px; height: 5px; border: 2.5px solid var(--raised); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

  .add {
    width: 100%; margin-top: 8px; font-size: 16px; background: none; border: 1px dashed color-mix(in srgb, var(--c, var(--title)) 55%, transparent);
    color: var(--c, var(--title)); border-radius: 10px; padding: 8px;
  }
  .add:hover { background: color-mix(in srgb, var(--c, var(--title)) 8%, var(--surface)); }
  .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; padding: 4px 0; }
  .empty { color: var(--muted); font-size: 16px; padding: 14px 4px; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 15px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--k); display: inline-block; }

  /* ---------- Semana inteira ---------- */
  .weekgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 1000px) { .weekgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 680px) { .weekgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .weekgrid { grid-template-columns: 1fr; } }
  .wcol { background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent); border-radius: 12px; overflow: hidden; min-width: 0; }
  .wcol.today { box-shadow: 0 0 0 2px var(--c); }
  .wcol-head { width: 100%; border: 0; padding: 8px 6px; text-align: center; color: var(--c); line-height: 1.1; }
  .wcol-head b { font-weight: normal; display: block; font-size: 19px; text-transform: uppercase; letter-spacing: .6px; }
  .wcol-head span { font-size: 15px; color: var(--muted); }
  .mini { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; align-items: start; padding: 6px 8px; border-top: 1px solid var(--line); border-left: 3px solid var(--k); cursor: pointer; }
  .mini .chk { width: 17px; height: 17px; border-width: 1.6px; border-radius: 4px; margin-top: 2px; }
  .mini .chk:checked::after { width: 8px; height: 4px; border-width: 2px; }
  .mini .t { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mini .x { font-size: 16px; line-height: 1.15; overflow-wrap: anywhere; }
  .mini.done .x { text-decoration: line-through; opacity: .5; }

  /* ---------- Metas da semana ---------- */
  .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
  .panel { --c: var(--pink); background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent); border-radius: 14px; padding: 0 16px 14px; min-width: 0; }
  .panel h2 { margin: 0 -16px 10px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-weight: normal; font-size: 21px; color: var(--c); text-transform: uppercase; letter-spacing: .6px; }
  .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  .list li { display: flex; align-items: flex-start; gap: 10px; }
  .list .chk { margin-top: 3px; }
  .list textarea { flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--ink); background: transparent; border: 0; border-radius: 4px; padding: 2px 4px; resize: none; field-sizing: content; overflow: hidden; line-height: 1.25; }
  .list textarea:focus { background: color-mix(in srgb, var(--c) 10%, var(--surface)); outline: none; }
  .list li.done textarea { text-decoration: line-through; opacity: .5; }
  .list .del { border: 0; background: none; color: var(--danger); font-size: 22px; line-height: 1; opacity: .35; }
  .list li:hover .del, .list .del:focus-visible { opacity: 1; }
  .remember .big { font-family: var(--f-hand); font-weight: 700; color: var(--title); font-size: 32px; display: inline-block; padding: 0 16px; border-radius: 999px; background: color-mix(in srgb, var(--pink) 13%, var(--surface)); transform: rotate(-4deg); margin: 6px 0 8px; }
  .remember p { font-family: var(--f-hand); font-size: 23px; color: var(--script); line-height: 1.25; margin: 0; }

  /* ---------- Fixas ---------- */
  .fixed-intro { color: var(--muted); font-size: 16px; margin: 0 0 12px; }
  .fixed-day { margin-bottom: 14px; }
  .fixed-day h3 { margin: 0 0 2px; font-weight: normal; font-size: 20px; color: var(--c); text-transform: uppercase; letter-spacing: .8px; display: flex; align-items: center; gap: 10px; }
  .fixed-day h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .fixed-day .add { width: auto; padding: 4px 12px; }

  /* ---------- Atividade física ---------- */
  .exsum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .stat { background: color-mix(in srgb, var(--green) 10%, var(--surface)); border-radius: 14px; padding: 10px 14px; }
  .stat b { display: block; font-weight: normal; font-size: 30px; color: var(--green); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: 15px; color: var(--muted); }
  .link-note { font-size: 16px; color: var(--muted); margin: 0 0 14px; }
  .exday h3 .rest { font-size: 14px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .exday .add { width: auto; padding: 4px 12px; --c: var(--green); }
  @media (max-width: 520px) { .exsum { grid-template-columns: 1fr 1fr; } .exsum .stat:last-child { grid-column: 1 / -1; } }

  /* ---------- Livros e filmes ---------- */
  .media-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .media-head h2 { margin: 0; font-family: var(--f-display); font-weight: normal; color: var(--title); font-size: 30px; }
  .media-head .btn { margin-left: auto; }
  .shelf { margin-bottom: 18px; }
  .shelf h3 { margin: 0 0 8px; font-weight: normal; font-size: 17px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; display: flex; gap: 8px; align-items: center; }
  .shelf h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .card {
    --c: var(--purple); background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
    border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; cursor: pointer; min-width: 0;
  }
  .card:hover { border-color: var(--c); }
  .card .top { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
  .card .ttl { font-size: 21px; line-height: 1.15; overflow-wrap: anywhere; }
  .card .by { font-size: 15px; color: var(--muted); }
  .card .note { font-size: 15px; color: var(--muted); font-family: var(--f-hand); font-size: 20px; line-height: 1.1; }
  .card .meta { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
  .card .meta .bar { flex: 1; min-width: 80px; }
  .card.done .ttl { text-decoration: line-through; opacity: .6; }
  .pill { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; border-radius: 999px; padding: 1px 8px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
  .step { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 2px 10px; font-size: 15px; }
  .stars { color: var(--gold); letter-spacing: 1px; }
  .btn { border: 1px solid var(--line); background: var(--raised); padding: 6px 16px; border-radius: 999px; font-size: 17px; }
  .btn.primary { background: var(--title); border-color: var(--title); color: var(--bg); }
  .btn.danger { color: var(--danger); }
  .btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--bg); }
  details.done-shelf summary { cursor: pointer; color: var(--muted); font-size: 17px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }

  .ico { display: inline-flex; }
  .ico svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .notice { padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; background: color-mix(in srgb, var(--peach) 16%, var(--surface)); }

  /* ---------- Prioridades, energia, sugestões ---------- */
  .prio { margin-bottom: 12px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 12px; }
  .row-actions .add { width: auto; flex: 1; margin: 0; }
  .energy, .suggest { border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; background: color-mix(in srgb, var(--blue) 9%, var(--surface)); }
  .suggest { background: color-mix(in srgb, var(--pink) 10%, var(--surface)); margin-top: 12px; font-size: 17px; }
  .energy .lbl { font-size: 17px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

// O ícone define a categoria (e a cor) da atividade

};

const catOf = it => CATS[ICON_CAT[it.icon]] ? ICON_CAT[it.icon] : 'trajeto';
const kColor = it => CATS[catOf(it)].color;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);

// ================= Datas =================
const DAYS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const parse = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return fmt(d); };
const weekOf = iso => addDays(iso, -parse(iso).getDay());
const ddmm = iso => { const d = parse(iso); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; };
const longDate = iso => { const d = parse(iso); return `${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const TODAY = fmt(new Date());
// As semanas do app andam de 7 em 7 dias a partir de sábado, 24/10/2026
const ANCHOR = '2026-10-24';
const blockOf = iso => { const n = Math.round((parse(iso) - parse(ANCHOR)) / 864e5); return addDays(ANCHOR, Math.floor(n / 7) * 7); };
const blockDays = b => [0, 1, 2, 3, 4, 5, 6].map(i => addDays(b, i));

function minutes(it) {
  if (it.special) return -1;
  const t = (it.time || '').toLowerCase(), m = t.match(/(\d{1,2}):(\d{2})/);
  if (m) return +m[1] * 60 + +m[2];
  if (t.startsWith('manh')) return 480;
  if (t.startsWith('tarde')) return 840;
  if (t.startsWith('noite')) return 1140;
  return 2000;
}
const PERIODS = [
  { key: 'manha', label: 'Manhã', icon: 'sol', test: m => m < 720 },
  { key: 'tarde', label: 'Tarde', icon: 'tarde', test: m => m >= 720 && m < 1080 },
  { key: 'noite', label: 'Noite', icon: 'lua', test: m => m >= 1080 && m < 2000 },
  { key: 'livre', label: 'Sem horário', icon: 'lista', test: m => m >= 2000 }
];

let chain = Promise.resolve();
function queue(fn) {
  if (!db) { toast('Abra pelo link do Claude para salvar.'); return chain; }
  chain = chain.then(fn).catch(e => toast(e && e.code === 'quota_exceeded' ? 'A agenda está cheia: apague semanas antigas.' : 'Não consegui salvar. Tente de novo.'));
  return chain;
}
function saveWeek(id, patch) {
  const exists = weeks.has(id), cur = weekDoc(id), next = { ...cur };
  for (const k in patch) next[k] = (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k])) ? { ...(cur[k] || {}), ...patch[k] } : patch[k];
  weeks.set(id, next);
  return queue(() => exists ? db.doc('weeks/' + id).update(patch) : db.doc('weeks/' + id).set(next));
}
function saveDoc(coll, arr, id, data) {
  const i = arr.findIndex(x => x.id === id);
  i >= 0 ? (arr[i] = { id, ...data }) : arr.push({ id, ...data });
  return queue(() => db.doc(coll + '/' + id).set(data));
}
function deleteDoc(coll, arr, id) {
  const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1);
  return queue(() => db.doc(coll + '/' + id).delete());
}

// Atividades de um dia: fixas (menos as puladas) + as da semana, em ordem de horário
function dayItems(iso) {
  const w = weekDoc(weekOf(iso)), skip = new Set(w.skip || []), wd = parse(iso).getDay();
  const fx = fixed.filter(f => f.weekday === wd).map(f => ({ ...f, iso, key: f.id + '_' + iso, fixedId: f.id, fixed: true }));
  const shown = fx.filter(f => !skip.has(f.key));
  const own = (w.items || []).filter(it => it.date === iso).map(it => ({ ...it, iso, key: it.id }));
  const list = [...shown, ...own].sort((a, b) => minutes(a) - minutes(b));
  const done = list.filter(it => w.done?.[it.key]).length;
  return { list, done, skipped: fx.length - shown.length, note: (w.notes || {})[iso] };
}
const isDone = it => !!weekDoc(weekOf(it.iso)).done?.[it.key];

const SUBS = [['dia', 'Dia a dia'], ['semana', 'Semana inteira'], ['metas', 'Metas da semana'], ['fixas', 'Atividades fixas'], ['retro', 'Retrospectiva']];
function renderRotina() {
  const ws = selWeek(), we = addDays(ws, 6);
  let total = 0, made = 0;
  for (const iso of blockDays(ws)) { const d = dayItems(iso); total += d.list.length; made += d.done; }
  let body = '';
  if (sub === 'dia') body = renderDay();
  else if (sub === 'semana') body = renderWeekGrid();
  else if (sub === 'metas') body = renderGoals();
  else if (sub === 'retro') body = renderRetro();
  else body = renderFixed();
  $('view').innerHTML = `
    ${sub === 'fixas' ? '' : weekbar(`${made} de ${total} feitas na semana`, total ? made / total : 0)}
    <div class="subnav" role="tablist">
      ${SUBS.map(([k, l]) => `<button role="tab" aria-selected="${sub === k}" data-sub="${k}">${l}</button>`).join('')}
    </div>
    ${body}`;
}
function weekbar(label, frac) {
  const ws = selWeek(), we = addDays(ws, 6), s = parse(ws), e = parse(we);
  const range = s.getMonth() === e.getMonth() ? `${s.getDate()} a ${e.getDate()} de ${MONTHS[e.getMonth()]}` : `${s.getDate()} de ${MONTHS[s.getMonth()]} a ${e.getDate()} de ${MONTHS[e.getMonth()]}`;
  const isThis = ws === blockOf(TODAY);
  return `<div class="weekbar">
      <button class="arrow" data-act="prev" aria-label="Semana anterior">‹</button>
      <div class="label">${range}<small>${isThis ? 'esta semana' : `${DAYS[s.getDay()].toLowerCase()} ${ddmm(ws)} a ${DAYS[e.getDay()].toLowerCase()} ${ddmm(we)}`}</small></div>

      ${isThis ? '' : '<button class="today-btn" data-act="today">voltar para hoje</button>'}

    </div>`;
}

  }).join('');

// Chuva de confete quando um dia inteiro é concluído ou um livro termina
function celebrate(msg) {
  toast(msg);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--pink', '--orange', '--gold', '--green', '--blue', '--purple'].map(v => cs.getPropertyValue(v).trim());
  const bits = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 120, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, r: Math.random() * 6.28, s: 5 + Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)] }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => { b.vy += .35; b.x += b.vx; b.y += b.vy; b.r += .2; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else cv.remove();
  })();
}
function findItem(key, iso) {
  if (key.startsWith('fixed:')) return { mode: 'fixed', fixedId: key.slice(6) };
  const [fid, fiso] = key.split('_');
  if (fiso) return { mode: 'fixed', fixedId: fid, iso: fiso };
  return { mode: 'week', id: key, iso };
}

$('view').addEventListener('click', e => {
  const t = e.target, act = t.closest('[data-act]')?.dataset.act;
  if (view !== 'rotina' && view !== 'treino') return;
  if (act === 'addprio') {
    const iso = t.closest('[data-prio]').dataset.prio;
    patchDay(iso, { prioridades: [...(dayDoc(iso).prioridades || []), { text: '', done: false }] }); render();
    const l = $('view').querySelectorAll('[data-prio] textarea'); l[l.length - 1]?.focus(); return;
  }
  const pli = t.closest('[data-prio] li[data-i]');
  if (pli) {
    const iso = t.closest('[data-prio]').dataset.prio, arr = (dayDoc(iso).prioridades || []).map(x => ({ ...x }));
    if (t.classList.contains('chk')) { arr[pli.dataset.i].done = t.checked; patchDay(iso, { prioridades: arr }); pli.classList.toggle('done', t.checked); if (t.checked && arr.every(x => x.done)) celebrate('Prioridades cumpridas! ♡'); }
    if (t.classList.contains('del')) { arr.splice(pli.dataset.i, 1); patchDay(iso, { prioridades: arr }); render(); }
    return;
  }
  const en = t.closest('[data-energia]');
  if (en) { const iso = t.closest('[data-energy]').dataset.energy; patchDay(iso, { energia: dayDoc(iso).energia === en.dataset.energia ? null : en.dataset.energia }); return render(); }
  const lz = t.closest('[data-lazer]');
  if (lz) return editActivity({ mode: 'new', iso: freestDay(), preset: { text: lz.dataset.lazer, icon: lz.dataset.iconK, time: 'Tarde' } });
  if (act === 'addex') return editActivity({ mode: 'new', iso: t.closest('[data-iso]').dataset.iso, exercise: true });
  if (act === 'addexfixed') return editActivity({ mode: 'newFixed', wd: parse(selDay).getDay(), exercise: true });
  if (t.closest('[data-sub]')) { sub = t.closest('[data-sub]').dataset.sub; remember(); return render(); }
  if (t.closest('[data-day]')) { const b = t.closest('[data-day]'); selDay = b.dataset.day; if (b.dataset.go) { sub = 'dia'; remember(); } return render(); }
  if (act === 'prev' || act === 'next') { selDay = addDays(selDay, act === 'prev' ? -7 : 7); return render(); }
  if (act === 'today') { selDay = TODAY; return render(); }
  if (act === 'add') return editActivity({ mode: 'new', iso: t.closest('[data-iso]').dataset.iso });
  if (act === 'addfixed') return editActivity({ mode: 'newFixed', wd: +t.closest('[data-wd]').dataset.wd });
  if (act === 'restore') {
    const iso = t.dataset.iso, w = weekDoc(weekOf(iso));

  }
  if (act === 'addgoal') {
    const panel = t.closest('.panel'), arr = goalList(panel);
    arr.push({ text: '', done: false }); saveGoal(panel, arr); render();
    const areas = $('view').querySelectorAll(`[data-list="${panel.dataset.list}"] textarea`); areas[areas.length - 1]?.focus(); return;
  }

  if (li) {

    if (t.classList.contains('chk')) { arr[li.dataset.i].done = t.checked; saveGoal(panel, arr); li.classList.toggle('done', t.checked); }
    if (t.classList.contains('del')) { arr.splice(li.dataset.i, 1); saveGoal(panel, arr); render(); }

  }
  const row = t.closest('[data-key]'); if (!row) return;
  if (t.classList.contains('chk')) return toggleDone(row.dataset.key, row.dataset.iso, t.checked);

// ---- Descarregue a mente: separa o texto em tarefas, compromissos e lembretes ----
const WEEKDAYS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
function parseDump(txt) {
  const parts = txt.split(/\n|[,;!?]+|\.(?!\d)|\s+e\s+(?=\S+r\b)|\s+e depois\s+/i).map(s => s.trim()).filter(s => s.length > 2);
  return parts.map(raw => {
    let text = raw.replace(/^(e\s+|depois\s+|também\s+|eu\s+)+/i, '').replace(/^(tenho que|tenho de|preciso|devo|quero|vou)\s+/i, '');
    const low = text.toLowerCase();
    let time = '', date = '';
    const tm = low.match(/(?:às|as|a partir das)?\s*(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);
    if (tm && +tm[1] < 24) time = `${tm[1].padStart(2, '0')}:${tm[2] || '00'}`;
    if (/\bamanhã\b|\bamanha\b/.test(low)) date = TOMORROW;
    else if (/\bhoje\b/.test(low)) date = TODAY;
    else { const w = WEEKDAYS.findIndex(d => low.includes(d) || low.includes(d.replace('ç', 'c').replace('á', 'a'))); if (w >= 0) { let iso = TODAY; while (parse(iso).getDay() !== w) iso = addDays(iso, 1); date = iso; } }
    let kind = 'tarefa';
    if (/^(lembrar|responder|ligar|mandar|enviar|pagar|comprar|marcar|avisar|agendar|devolver|buscar)/.test(low) || low.includes('lembrar')) kind = 'lembrete';
    else if (time || date || /\b(aula|consulta|reunião|reuniao|prova|academia|treino|jantar|almoço|almoco|encontro|ir (à|ao|a|para|no|na))\b/.test(low)) kind = 'compromisso';
    text = text.charAt(0).toUpperCase() + text.slice(1);
    return { text, kind, time, date };
  });
}
const KINDS = { tarefa: ['Tarefas', 'lista', 'var(--blue)'], compromisso: ['Compromissos', 'agenda', 'var(--pink)'], lembrete: ['Lembretes', 'estrela', 'var(--gold)'] };
function renderMente() {
  const items = [...S.inbox.entries()].map(([id, x]) => ({ id, ...x })).sort((a, b) => (a.created || 0) - (b.created || 0));

    : x.kind === 'lembrete' ? (x.text.toLowerCase().startsWith('comprar') ? 'Sugestão: lista de compras ou prioridade de hoje' : 'Sugestão: prioridade de hoje') : 'Sugestão: prioridade de amanhã';
  return `<section class="wcard"><h3>Descarregue sua mente</h3>
      <p class="muted small">Escreva tudo o que está pensando, mesmo bagunçado. Para falar em vez de digitar, toque no microfone do teclado.</p>

          ${x.text.toLowerCase().startsWith('comprar') ? '<button class="pillbtn" data-move="desejo">Lista de compras</button>' : ''}

$('view').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-go-view]')) { view = t.closest('[data-go-view]').dataset.goView; remember(); return render(); }
  if (!['bem', 'dinheiro', 'diario'].includes(view)) return;
  const s2 = t.closest('[data-sub2]'); if (s2) { sub2[view] = s2.dataset.sub2; return render(); }
  const mo = t.closest('[data-month]'); if (mo) { monthSel = shiftMonth(monthSel, +mo.dataset.month); return render(); }
  const act = t.closest('[data-act]')?.dataset.act;
  if (view === 'bem') {
    const hu = t.closest('[data-humor]'); if (hu) { patchDay(TODAY, { humor: hu.dataset.humor }); return render(); }
    const pz = t.closest('[data-prazo]'); if (pz) { sub2.prazo = pz.dataset.prazo; return render(); }
    const hd = t.closest('[data-habday]'); if (hd) { habDay = hd.dataset.habday; return render(); }
    const st = t.closest('[data-hstep]');
    if (st) {
      const h = habitList().find(x => x.id === t.closest('[data-habit]').dataset.habit);
      const cur = (dayDoc(habDay).habitos || {})[h.id] || 0, next = Math.max(0, cur + +st.dataset.hstep);
      patchDay(habDay, { habitos: { ...(dayDoc(habDay).habitos || {}), [h.id]: next } }); render();
      if (+st.dataset.hstep > 0 && habitList().every(x => habitCount(x, habDay) >= x.goal)) celebrate('Todos os hábitos do dia! ♡');
      return;
    }
    if (act === 'edithabit') return editHabit(habitList().find(x => x.id === t.closest('[data-habit]').dataset.habit));
    if (act === 'addhabit') return editHabit();
    if (act === 'addobj') return editObjetivo();
    const ob = t.closest('[data-obj]'); if (ob) return editObjetivo({ id: ob.dataset.obj, ...S.objetivos.get(ob.dataset.obj) });
    if (act === 'ciclohoje') { put('perfil', 'main', { ...(S.perfil.get('main') || {}), cicloInicio: TODAY }); return render(); }
    if (act === 'ciclo') {
      const p = S.perfil.get('main') || {};
      return openForm({ title: 'Ciclo menstrual', fields: [
        { name: 'cicloInicio', label: 'Início da última menstruação', type: 'date', value: p.cicloInicio || TODAY, full: true },
        { name: 'cicloDuracao', label: 'Duração do ciclo (dias)', type: 'number', value: p.cicloDuracao || 28 }
      ], onSave: v => put('perfil', 'main', { ...p, cicloInicio: v.cicloInicio, cicloDuracao: v.cicloDuracao || 28 }) });
    }
  }
  if (view === 'dinheiro') {
    if (act === 'addgasto') return editMoney(null, 'saida');
    if (act === 'addentrada') return editMoney(null, 'entrada');
    if (act === 'addwish') return editWish();
    const mr = t.closest('[data-money]'); if (mr) return editMoney({ id: mr.dataset.money, ...S.money.get(mr.dataset.money) });
    const wc = t.closest('[data-wish]');
    if (wc) {
      const x = { id: wc.dataset.wish, ...S.wishes.get(wc.dataset.wish) };
      if (t.classList.contains('chk')) {
        const { id, ...data } = x;
        put('wishes', id, { ...data, bought: t.checked });
        if (t.checked && x.price) { put('money', uid('m'), { type: 'saida', value: x.price, date: TODAY, desc: x.name, cat: 'compras' }); toast('Comprado! O valor entrou nos seus gastos.'); }
        return render();
      }
      return editWish(x);
    }
  }
  if (view === 'diario') {
    const fe = t.closest('[data-feel]'); if (fe) return editEntry(null, fe.dataset.feel);
    const en = t.closest('[data-entry]'); if (en) return editEntry({ id: en.dataset.entry, ...S.journal.get(en.dataset.entry) });
    if (act === 'addgrat') { patchDay(TODAY, { gratidao: [...(dayDoc(TODAY).gratidao || []), ''] }); render(); const l = $('view').querySelectorAll('[data-grat] textarea'); l[l.length - 1]?.focus(); return; }
    const gl = t.closest('[data-grat] li[data-i]');
    if (gl && t.classList.contains('del')) { const g = [...(dayDoc(TODAY).gratidao || [])]; g.splice(gl.dataset.i, 1); patchDay(TODAY, { gratidao: g }); return render(); }
    if (act === 'organizar') {
      const txt = $('dump').value.trim(); if (!txt) return toast('Escreva alguma coisa primeiro ♡');
      const parsed = parseDump(txt);
      parsed.forEach((x, i) => put('inbox', uid('i'), { ...x, created: Date.now() + i }));
      toast(`Organizei ${parsed.length} ite${parsed.length > 1 ? 'ns' : 'm'} ♡`); return render();
    }
    const mv = t.closest('[data-move]');
    if (mv) {
      const id = t.closest('[data-inbox]').dataset.inbox, x = S.inbox.get(id), how = mv.dataset.move;
      if (how === 'tipo') { const ks = Object.keys(KINDS); put('inbox', id, { ...x, kind: ks[(ks.indexOf(x.kind) + 1) % ks.length] }); return render(); }
      if (how === 'feito') { del('inbox', id); return render(); }
      if (how === 'hoje' || how === 'amanha') {
        const iso = how === 'hoje' ? TODAY : TOMORROW;
        patchDay(iso, { prioridades: [...(dayDoc(iso).prioridades || []), { text: x.text, done: false }] });
        del('inbox', id); toast(`Foi para as prioridades de ${how === 'hoje' ? 'hoje' : 'amanhã'} ♡`); return render();
      }
      if (how === 'desejo') { put('wishes', uid('d'), { name: x.text.replace(/^comprar\s+/i, ''), price: 0, priority: 'media', bought: false }); del('inbox', id); toast('Foi para a lista Quero comprar ♡'); return render(); }
      if (how === 'rotina') { del('inbox', id); return editActivity({ mode: 'new', iso: x.date || TODAY, preset: { text: x.text, time: x.time, icon: /academia|treino/i.test(x.text) ? 'academia' : 'agenda' } }); }
    }
  }
});
$('view').addEventListener('change', e => {
  const t = e.target, f = t.dataset.dayField;
  if (f) { const v = f === 'diario' ? t.value : (t.value.trim() === '' ? null : parseMoney(t.value)); patchDay(TODAY, { [f]: v }); return; }
  const gl = t.closest('[data-grat] li[data-i]');
  if (gl) { const g = [...(dayDoc(TODAY).gratidao || [])]; g[gl.dataset.i] = t.value.trim(); patchDay(TODAY, { gratidao: g }); }
});

// ================= Livros =================
const BOOK_STATUS = [['lendo', 'Lendo agora'], ['quero', 'Quero ler'], ['lido', 'Já li']];
function renderBooks() {
  const card = b => {
    const pct = b.pages ? Math.min(100, Math.round((b.page || 0) / b.pages * 100)) : 0;
    return `<div class="card ${b.status === 'lido' ? 'done' : ''}" tabindex="0" data-book="${b.id}" style="--c:var(--purple)">
      <div class="top"><input type="checkbox" class="chk" ${b.status === 'lido' ? 'checked' : ''} aria-label="Terminei"><div><div class="ttl">${esc(b.title)}</div>${b.author ? `<div class="by">${esc(b.author)}</div>` : ''}</div></div>
      ${b.status === 'lendo' ? `<div class="meta"><span>pág. ${b.page || 0}${b.pages ? ` de ${b.pages}` : ''}</span>${b.pages ? `<span class="bar"><i style="width:${pct}%"></i></span><span>${pct}%</span>` : ''}<button class="step" data-step="10">+10 pág.</button></div>` : ''}
      ${b.note ? `<div class="note">${esc(b.note)}</div>` : ''}
    </div>`;
  };
  const by = s => books.filter(b => b.status === s);
  $('view').innerHTML = `
    <div class="media-head"><h2>Livros</h2><button class="btn primary" data-new="book">+ Adicionar livro</button></div>
    ${books.length ? '' : '<div class="empty">Nenhum livro ainda. Toque em "Adicionar livro" ou me mande a lista que eu coloco aqui.</div>'}
    ${by('lendo').length ? `<section class="shelf"><h3>Lendo agora</h3><div class="cards">${by('lendo').map(card).join('')}</div></section>` : ''}
    ${by('quero').length ? `<section class="shelf"><h3>Quero ler</h3><div class="cards">${by('quero').map(card).join('')}</div></section>` : ''}
    ${by('lido').length ? `<details class="done-shelf"><summary>Já li (${by('lido').length})</summary><div class="cards">${by('lido').map(card).join('')}</div></details>` : ''}`;
}
function editBook(b) {
  const isNew = !b; b = b || { status: 'lendo' };
  openForm({
    title: isNew ? 'Novo livro' : 'Editar livro',
    fields: [
      { name: 'title', label: 'Título', value: b.title, full: true },
      { name: 'author', label: 'Autor(a)', value: b.author, full: true },
      { name: 'status', label: 'Situação', type: 'select', options: BOOK_STATUS, value: b.status, full: true },
      { name: 'page', label: 'Página atual', type: 'number', value: b.page },
      { name: 'pages', label: 'Total de páginas', type: 'number', value: b.pages },
      { name: 'note', label: 'Anotação (opcional)', value: b.note, full: true, placeholder: 'ex.: amando o capítulo 3' }
    ],
    onDelete: isNew ? null : () => deleteDoc('books', books, b.id),
    onSave: v => saveDoc('books', books, b.id || uid('b'), { ...v, title: v.title || 'Livro sem título', updated: Date.now() })
  });
}

// ================= Filmes e séries =================
const SHOW_STATUS = [['vendo', 'Assistindo'], ['quero', 'Quero ver'], ['visto', 'Já vi']];
function renderShows() {
  const card = s => `<div class="card ${s.status === 'visto' ? 'done' : ''}" tabindex="0" data-show="${s.id}" style="--c:${s.kind === 'serie' ? 'var(--blue)' : 'var(--pink)'}">
      <div class="top"><input type="checkbox" class="chk" ${s.status === 'visto' ? 'checked' : ''} aria-label="Já vi"><div><div class="ttl">${esc(s.title)}</div>
      <div class="meta"><span class="pill">${s.kind === 'serie' ? 'Série' : 'Filme'}</span>${s.where ? `<span>${esc(s.where)}</span>` : ''}${s.rating ? `<span class="stars">${'★'.repeat(s.rating)}${'☆'.repeat(5 - s.rating)}</span>` : ''}</div></div></div>
      ${s.kind === 'serie' && s.status === 'vendo' ? `<div class="meta"><span>Temporada ${s.season || 1} · episódio ${s.episode || 1}</span><button class="step" data-step="1">+1 episódio</button></div>` : ''}
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
    </div>`;
  const by = st => shows.filter(s => s.status === st);
  $('view').innerHTML = `
    <div class="media-head"><h2>Filmes e séries</h2><button class="btn primary" data-new="show">+ Adicionar</button></div>
    ${shows.length ? '' : '<div class="empty">Nada por aqui ainda. Toque em "Adicionar" ou me mande o que você está vendo.</div>'}
    ${by('vendo').length ? `<section class="shelf"><h3>Assistindo</h3><div class="cards">${by('vendo').map(card).join('')}</div></section>` : ''}
    ${by('quero').length ? `<section class="shelf"><h3>Quero ver</h3><div class="cards">${by('quero').map(card).join('')}</div></section>` : ''}
    ${by('visto').length ? `<details class="done-shelf"><summary>Já vi (${by('visto').length})</summary><div class="cards">${by('visto').map(card).join('')}</div></details>` : ''}`;
}
function editShow(s) {
  const isNew = !s; s = s || { kind: 'serie', status: 'vendo', season: 1, episode: 1 };
  openForm({
    title: isNew ? 'Novo filme ou série' : 'Editar',
    fields: [
      { name: 'title', label: 'Título', value: s.title, full: true },
      { name: 'kind', label: 'Tipo', type: 'select', options: [['serie', 'Série'], ['filme', 'Filme']], value: s.kind },
      { name: 'status', label: 'Situação', type: 'select', options: SHOW_STATUS, value: s.status },
      { name: 'season', label: 'Temporada (série)', type: 'number', value: s.season },
      { name: 'episode', label: 'Episódio (série)', type: 'number', value: s.episode },
      { name: 'where', label: 'Onde assistir', value: s.where, placeholder: 'ex.: Netflix' },
      { name: 'rating', label: 'Nota', type: 'select', options: [[0, 'sem nota'], [1, '★'], [2, '★★'], [3, '★★★'], [4, '★★★★'], [5, '★★★★★']], value: s.rating || 0 },
      { name: 'note', label: 'Anotação (opcional)', value: s.note, full: true }
    ],
    onDelete: isNew ? null : () => deleteDoc('shows', shows, s.id),
    onSave: v => saveDoc('shows', shows, s.id || uid('s'), { ...v, rating: +v.rating, title: v.title || 'Sem título', updated: Date.now() })
  });
}

// Cliques em livros e filmes
$('view').addEventListener('click', e => {
  if (view === 'rotina' || view === 'treino') return;
  const t = e.target;
  if (t.closest('[data-new]')) return t.closest('[data-new]').dataset.new === 'book' ? editBook() : editShow();
  const bc = t.closest('[data-book]'), sc = t.closest('[data-show]');
  if (bc) {
    const b = books.find(x => x.id === bc.dataset.book); const { id, ...data } = b;
    if (t.classList.contains('chk')) { saveDoc('books', books, id, { ...data, status: t.checked ? 'lido' : 'lendo', page: t.checked && b.pages ? b.pages : b.page, updated: Date.now() }); if (t.checked) celebrate('Livro terminado! ♡'); return render(); }
    if (t.dataset.step) { const page = Math.min((b.page || 0) + 10, b.pages || Infinity); saveDoc('books', books, id, { ...data, page, status: b.pages && page >= b.pages ? 'lido' : 'lendo', updated: Date.now() }); return render(); }
    return editBook(b);
  }
  if (sc) {
    const s = shows.find(x => x.id === sc.dataset.show); const { id, ...data } = s;
    if (t.classList.contains('chk')) { saveDoc('shows', shows, id, { ...data, status: t.checked ? 'visto' : 'vendo', updated: Date.now() }); return render(); }
    if (t.dataset.step) { saveDoc('shows', shows, id, { ...data, episode: (s.episode || 1) + 1, updated: Date.now() }); return render(); }
    return editShow(s);
  }
});

// ================= Início =================
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
render();
(async () => {
  db = window.claude?.use ? await window.claude.use('db') : null;
  if (!db) {
    $('notice').hidden = false;
    $('notice').textContent = 'Sua agenda fica salva na nuvem quando você abre esta página pelo link do Claude. Aqui ela não consegue carregar nem salvar.';
    return;
  }
  const lost = () => toast('Perdi a conexão com a agenda. Recarregue a página.');
  const typing = () => document.activeElement?.tagName === 'TEXTAREA' || $('dlg').open;
  const later = () => { if (!typing()) render(); };
  db.collection('fixed').onSnapshot(s => { fixed = s.docs.map(d => ({ id: d.id, ...d.data() })); later(); }, lost);
  db.collection('weeks').onSnapshot(s => { weeks.clear(); s.docs.forEach(d => weeks.set(d.id, { ...blankWeek(d.id), ...d.data() })); later(); }, lost);
  db.collection('goals').onSnapshot(s => { goals.clear(); s.docs.forEach(d => goals.set(d.id, d.data())); later(); }, lost);
  COLLS.forEach(c => db.collection(c).onSnapshot(s => { S[c].clear(); s.docs.forEach(d => S[c].set(d.id, d.data())); later(); }, lost));
  db.collection('books').onSnapshot(s => { books = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updated || 0) - (a.updated || 0)); later(); }, lost);
  db.collection('shows').onSnapshot(s => { shows = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updated || 0) - (a.updated || 0)); later(); }, lost);
  document.addEventListener('focusout', () => setTimeout(later, 60));
  $('dlg').addEventListener('close', later);
})();
</script>
